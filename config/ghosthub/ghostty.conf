# ~/.config/ghosthub/ghostty.conf
# Terminal configuration for Ghosthub (standard Ghostty config format).
#
# Symlinked from dot_files/config/ghosthub/ghostty.conf.
#
# Ordering matters: Ghostty applies the LAST assignment for a given key, so the
# personal overrides at the bottom win over the Ghosthub managed block above
# them. Do not move the personal section above the managed block.

# --- Ghosthub defaults (outside the managed block) ---
background-opacity = 0.95
minimum-contrast = 3

# Ghosthub handles its own keybindings for splits, tabs, and navigation.
# Terminal-level keybindings live in the personal section below.

# --- Personal overrides (mirrors config/ghostty/config) ---
font-family = "MesloLGS Nerd Font Mono"
font-size = 13
scrollback-limit = 100000000
confirm-close-surface = false
macos-option-as-alt = true

# Overrides the managed block's shell-integration = detect. Powerlevel10k emits
# the Ghostty prompt markers itself via POWERLEVEL9K_TERM_SHELL_INTEGRATION=true
# in .p10k.zsh, so Ghostty must not inject its own integration.
shell-integration = none

# keybindings
keybind = shift+enter=text:\x1b\r
keybind = alt+left=text:\x1b[1;3D
keybind = alt+right=text:\x1b[1;3C

# >>> Ghosthub managed terminal settings >>>
term = xterm-256color
cursor-style = block
mouse-hide-while-typing = true
copy-on-select = clipboard
shell-integration = detect
shell-integration-features = no-cursor
# <<< Ghosthub managed terminal settings <<<
